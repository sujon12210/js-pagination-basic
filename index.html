<!DOCTYPE html>
<html>
<head>
  <title>Pagination Basic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box">
    <h2>Pagination</h2>
    <ul id="list"></ul>

    <div class="controls">
      <button onclick="prev()">Prev</button>

      <button onclick="next()">Next</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
